name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    # Signing secrets live in this environment, which only v* tags can use.
    environment: release
    steps:
      - uses: actions/checkout@v7

      - name: Test
        run: swift test

      - name: Import Developer ID certificate
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          base64 --decode <<<"$DEVELOPER_ID_P12" > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -f pkcs12 -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/developer-id.p12"

      - name: Build, sign and notarize
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          export NOTARY_KEY_PATH="$RUNNER_TEMP/notary.p8"
          base64 --decode <<<"$NOTARY_KEY" > "$NOTARY_KEY_PATH"
          RIPPLE_VERSION="${GITHUB_REF_NAME#v}" bash scripts/release.sh
          rm "$NOTARY_KEY_PATH"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "dist/Ripple-$VERSION.zip" --title "Ripple $VERSION" --generate-notes

      - name: Update Homebrew cask
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA="$(shasum -a 256 "dist/Ripple-$VERSION.zip" | cut -d ' ' -f 1)"
          mkdir -p ~/.ssh
          curl -fsSL https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' >> ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add - <<<"$TAP_DEPLOY_KEY"
          git clone git@github.com:xinding33/homebrew-tap.git "$RUNNER_TEMP/tap"
          bash scripts/update-cask.sh "$RUNNER_TEMP/tap" "$VERSION" "$SHA"
          cd "$RUNNER_TEMP/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ripple $VERSION"
          git push

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
